# Set default terminal to support 256 colors
# This advertises to programs inside tmux that you support 256 + true-color
set -g default-terminal "tmux-256color"
# Enable true color (24-bit) support
# This tells tmux itself that the outside xterm* client supports true-color
# which allows for better color rendering in tmux, making the visual experience
# more consistent with GUI applications
set-option -sa terminal-overrides ",xterm*:Tc"

# Change leader key from Ctrl+b to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# Enable mouse support
# Allows clicking on panes to select them, scrolling with mouse wheel,
# and resizing panes by dragging
set -g mouse on

# Start windows and panes indexing at 1 instead of 0
# Makes it more intuitive for keyboard navigation (keys 1-9 are in
# sequential order on keyboard)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
# Automatically renumber windows when one is closed
# Maintains sequential window numbering without gaps
set-option -g renumber-windows on

# Keep the client attached when its session is destroyed
# Closing a session's last window switches to another session instead of
# detaching, which would stop the container
set -g detach-on-destroy off

# Maintain the current directory
# Vertical split (") with the same directory as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
# Horizontal split (%) with the same directory as the current pane
bind % split-window -h -c "#{pane_current_path}"
# New window (c) with the same directory as the current pane
bind c new-window -c "#{pane_current_path}"

# Set escape time to 0 (eliminate delay)
# Removes the delay when pressing Escape, which is crucial for vim users
# and makes the terminal more responsive
set -s escape-time 0

# Use vi key bindings in copy mode
# Helps vim users have consistent key bindings for navigation and selection
set-window-option -g mode-keys vi
# Configure vi-like key bindings for selection in copy mode
# v: start selection similar to vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
# C-v: toggle rectangle/block selection mode similar to vim
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# y: copy selection and exit copy mode similar to vim's yank
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Switch tmux windows with Shift+Alt+h/l
bind-key -n M-H previous-window
bind-key -n M-L next-window

# Switch tmux sessions with Shift+Alt+j/k
bind-key -n M-J switch-client -n
bind-key -n M-K switch-client -p

# Sesh - pick or create a session from a fzf popup
# Lists tmux sessions, sesh configs and zoxide directories; connecting to a
# directory creates a session there
# https://github.com/joshmedeski/sesh#tmux--fzf
bind-key s run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fdfind -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
# Switch to the last session, even if it was closed
bind-key L run-shell "sesh last"

# Catppuccin Tmux Theme - a beautiful pastel theme for tmux
# Enhances the visual aesthetics of tmux with a cohesive color scheme
# Set the desired flavor (mocha, macchiato, frappe, latte)
set -g @catppuccin_flavour "mocha"
# Override Catppuccin status bar window text
# https://github.com/catppuccin/tmux/issues/53#issuecomment-3113262100
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# Load the theme (installed via chezmoi external)
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

###
# Plugin declarations for Tmux Plugin Manager (TPM)
###

# TPM itself - manages all other plugins
# Allows for easy installation and updates of plugins with
# prefix + I (install) and prefix + U (update)
set -g @plugin "tmux-plugins/tpm"

# Tmux Sensible - a set of basic tmux settings everyone can agree on
# Provides reasonable defaults for key settings like history limit,
# display time, etc.
set -g @plugin "tmux-plugins/tmux-sensible"

# Tmux Yank - enables copying to system clipboard
# Integrates tmux copy with system clipboard, making it easier to
# transfer text between tmux and other applications
set -g @plugin "tmux-plugins/tmux-yank"

# Vim Tmux Navigator - enables seamless pane navigation between vim and tmux
# Allows using Ctrl-h/j/k/l keybindings to move between vim splits and tmux
# panes without manual switching
set -g @plugin "christoomey/vim-tmux-navigator"

# Initialize Tmux Plugin Manager
# This line runs TPM which processes all the plugin declarations above
# Keep this at the very bottom of tmux.conf
run "$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm"
